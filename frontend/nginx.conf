server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The app calls /api/... on its own origin (VITE_API_BASE_URL is empty in the
    # build), so nginx forwards those to the API container. This replaces the
    # vite dev-server proxy and means the browser never sees a cross-origin call.
    #
    # `api` is the Compose service name; 8080 is the port INSIDE that container.
    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Hashed asset filenames never change content, so cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: vue-router owns the URLs, so any path that isn't a real file
    # must return index.html rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
